<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Lightning Lens. Art sits on Apple's 824/1024 icon grid, leaving room for the system shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb21a"/><stop offset="1" stop-color="#ff4d2e"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6a8"/><stop offset="1" stop-color="#ffd23a"/>
    </linearGradient>
  </defs>
  <!-- Apple's macOS icon shape: 824x824 rounded rect, corner radius 185, at (100,100) of 1024. -->
  <rect x="9.766" y="9.766" width="80.469" height="80.469" rx="18.105" fill="url(#bg)"/>
  <g transform="translate(9.77 9.77) scale(0.8047)">
    <circle cx="44" cy="42" r="24" fill="#2b0f05" fill-opacity="0.25"/>
    <circle cx="44" cy="42" r="24" fill="none" stroke="#ffffff" stroke-width="7"/>
    <path d="M48 24 L34 45 H44 L39 61 L55 38 H45 Z" fill="url(#bolt)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M62 60 L80 78" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
